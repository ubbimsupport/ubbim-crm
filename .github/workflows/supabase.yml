name: Supabase

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/supabase.yml"
  workflow_dispatch:

jobs:
  test-migrations:
    name: Test migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - name: Start local database and apply committed migrations
        run: supabase db start

  deploy-production:
    name: Deploy migrations to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-migrations
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - name: Link project and push pending migrations
        run: |
          PROJECT_REF="${SUPABASE_PROJECT_ID:-fxsdcrihxxyavauhafdv}"
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Skipping remote deploy."
            echo "Add GitHub Actions secrets SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD."
            echo "Optional: SUPABASE_PROJECT_ID (defaults to fxsdcrihxxyavauhafdv)."
            exit 0
          fi
          supabase link --project-ref "$PROJECT_REF"
          supabase db push
